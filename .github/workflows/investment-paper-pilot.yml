name: V4.3 Alpaca PAPER Pilot (shadow by default)

on:
  workflow_dispatch:
  schedule:
    # Weekday market-session read-only shadow check; Alpaca market clock is authoritative.
    - cron: '10 15 * * 1-5'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: alpaca-paper-pilot-single-writer
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all safety and resilience tests
        run: python -m unittest discover -s tests -v
      - name: Run isolated Alpaca paper pilot (default shadow only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
          # Deliberately fixed: scheduled workflow can NEVER submit orders.
          # A separately reviewed/manual approval workflow is required later.
          PAPER_PILOT_MODE: 'shadow'
          PAPER_PILOT_APPROVED: 'false'
        run: python paper_pilot.py
      - name: Save non-secret order safety audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-paper-pilot-${{ github.run_id }}
          path: paper-pilot-report.json
          if-no-files-found: error
          retention-days: 30
