name: Nexus Studio offline validation

on:
  push:
    branches:
      - feature/multi-ai-studio
    paths:
      - 'ai_studio/**'
      - 'requirements.txt'
      - '.github/workflows/nexus-studio-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline Studio tests
        run: python -m unittest discover -s ai_studio/tests -v
      - name: Verify JavaScript syntax
        run: node --check ai_studio/static/app.js
