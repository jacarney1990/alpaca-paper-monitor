name: Investment intelligence (read only)
on:
  schedule:
    # Three daily runs; news and filings can occur outside market hours.
    - cron: '11 13,18,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: investment-intelligence
  cancel-in-progress: false
jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Review fresh news and official filings; email new leads only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python intelligence.py
