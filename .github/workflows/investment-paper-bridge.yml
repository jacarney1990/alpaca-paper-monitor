name: Investment V3.3 Paper Broker Readiness (NO orders)

on:
  workflow_dispatch:
  # Run after V3 actually finishes, even when the scheduler is delayed.
  # Failed parents also produce an explicit blocked readiness report.
  workflow_run:
    workflows: ['Investment V3 (paper-aware, virtual trades only)']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: investment-paper-readiness-v33
  cancel-in-progress: false

jobs:
  paper-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run paper-preflight regression tests
        run: python -m unittest discover -s tests -p 'test_paper_bridge.py' -v
      - name: Assess paper account and V3.1 decisions (NO orders)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          V3_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
        run: python paper_bridge.py
      - name: Preserve paper readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-readiness-${{ github.run_id }}
          path: paper-readiness.json
          if-no-files-found: warn
          retention-days: 30
